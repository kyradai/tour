<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kyradai / Tour</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f5ebe0;
      color: #3e362f;
      min-height: 100vh;
      padding: 40px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.8rem;
      color: #5a6b4a;
      margin-bottom: 12px;
    }

    #search-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #c9b8a3;
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
      background: #fffdf9;
      color: #3e362f;
      transition: border-color 0.2s;
    }

    #search-input:focus {
      border-color: #5a6b4a;
    }

    #location-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .location-card {
      background: #fffdf9;
      border: 2px solid #c9b8a3;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .location-card:hover {
      transform: translateY(-2px);
      border-color: #5a6b4a;
      box-shadow: 0 4px 12px rgba(62, 54, 47, 0.1);
    }

    .location-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #5a6b4a;
      text-transform: capitalize;
    }

    .location-arrow {
      font-size: 1.2rem;
      color: #c9b8a3;
      transition: color 0.2s;
    }

    .location-card:hover .location-arrow {
      color: #5a6b4a;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: #7a6e65;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #7a6e65;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Kyradai / Tour</h1>
      <input type="text" id="search-input" placeholder="Search locations..." oninput="filterLocations()" />
    </div>

    <div id="location-list"></div>
  </div>

  <footer>
    Made with 💙 for the people I love.
  </footer>

  <script>
    // List of location folder names present in your project
    const FOLDERS = [
      'playa-de-la-concha',
      'playa-de-los-peligros',
      'playa-del-huevo'
    ];

    // Build array with relative subpath routing (/tour/[folder-name])
    const locations = FOLDERS.map(slug => ({
      name: slug.replace(/-/g, ' '),
      slug: slug,
      url: `/tour/${slug}`
    }));

    let filteredLocations = [...locations];

    function renderList(items) {
      const container = document.getElementById('location-list');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">No matching locations found</div>';
        return;
      }

      items.forEach(loc => {
        const card = document.createElement('a');
        card.className = 'location-card';
        card.href = loc.url;

        card.innerHTML = `
          <span class="location-title">${loc.name}</span>
          <span class="location-arrow">➔</span>
        `;

        container.appendChild(card);
      });
    }

    function filterLocations() {
      const query = document.getElementById('search-input').value.toLowerCase();
      filteredLocations = locations.filter(loc => loc.name.toLowerCase().includes(query));
      renderList(filteredLocations);
    }

    // Initial render
    renderList(filteredLocations);
  </script>
</body>
</html>
