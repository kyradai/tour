<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#07070a">

    <title>Kyradai / Tour</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07070a;

            --text: rgba(255,255,255,.94);
            --text-soft: rgba(255,255,255,.58);
            --text-faint: rgba(255,255,255,.34);

            --border: rgba(255,255,255,.14);
            --border-hover: rgba(255,255,255,.28);

            --purple: #9c7cff;
            --blue: #6cddff;

            --page-width: 760px;

            --page-padding-x: clamp(
                16px,
                4vw,
                30px
            );

            --page-padding-top: clamp(
                20px,
                5vh,
                55px
            );

            --page-padding-bottom: 110px;

            --card-height: 78px;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;

            overflow: hidden;

            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 0% 0%,
                    rgba(125,83,255,.18),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(40,190,255,.13),
                    transparent 34%
                ),
                var(--bg);
        }

        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }

        .blob {
            position: absolute;

            width: min(55vw, 600px);
            height: min(55vw, 600px);

            border-radius: 50%;

            filter:
                blur(
                    clamp(
                        50px,
                        8vw,
                        110px
                    )
                );

            opacity: .55;

            animation:
                floatBlob
                18s
                ease-in-out
                infinite;
        }

        .blob-purple {
            top: -20%;
            left: -15%;

            background:
                radial-gradient(
                    circle,
                    #8b65ff,
                    #5133c9 42%,
                    transparent 72%
                );
        }

        .blob-blue {
            right: -15%;
            bottom: -20%;

            background:
                radial-gradient(
                    circle,
                    #50dfff,
                    #1682ac 42%,
                    transparent 72%
                );

            animation-delay: -7s;
        }

        .blob-pink {
            width: min(30vw, 300px);
            height: min(30vw, 300px);

            top: 40%;
            left: 45%;

            opacity: .13;

            background:
                radial-gradient(
                    circle,
                    #ff71c6,
                    transparent 70%
                );

            animation-delay: -12s;
        }

        @keyframes floatBlob {

            0%,
            100% {
                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(30px,-30px,0)
                    scale(1.08);
            }
        }

        .vignette {
            position: fixed;
            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    transparent 30%,
                    rgba(0,0,0,.45)
                );
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            position: relative;

            z-index: 2;

            width: min(
                100%,
                var(--page-width)
            );

            height: 100vh;
            height: 100svh;
            height: 100dvh;

            margin: 0 auto;

            padding-top:
                max(
                    var(--page-padding-top),
                    env(safe-area-inset-top)
                );

            padding-left:
                var(--page-padding-x);

            padding-right:
                var(--page-padding-x);

            padding-bottom:
                max(
                    var(--page-padding-bottom),
                    env(safe-area-inset-bottom)
                );

            display: flex;

            flex-direction: column;

            min-height: 0;

            overflow: hidden;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            flex: 0 0 auto;

            margin-bottom: 20px;

            animation:
                fadeUp
                .6s
                ease
                both;
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 8px;

            color: var(--text-soft);

            font-size: .72rem;

            font-weight: 700;

            letter-spacing: .15em;

            text-transform: uppercase;
        }

        .brand-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            box-shadow:
                0 0 15px
                rgba(156,124,255,.9);
        }

        h1 {
            font-size:
                clamp(
                    3rem,
                    10vw,
                    5.25rem
                );

            line-height: .9;

            letter-spacing: -.075em;

            font-weight: 800;

            background:
                linear-gradient(
                    120deg,
                    #fff 10%,
                    #d9d1ff 50%,
                    #9cecff 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .description {
            max-width: 540px;

            margin-top: 13px;

            color: var(--text-soft);

            font-size: .9rem;

            line-height: 1.5;
        }

        /* =====================================================
           SEARCH
        ===================================================== */

        .search {
            position: relative;

            margin-top: 18px;
        }

        #search {
            width: 100%;
            height: 54px;

            padding: 0 45px;

            border:
                1px solid
                var(--border);

            border-radius: 18px;

            outline: none;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.105),
                    rgba(255,255,255,.035)
                );

            backdrop-filter:
                blur(25px)
                saturate(160%);

            -webkit-backdrop-filter:
                blur(25px)
                saturate(160%);

            box-shadow:
                inset
                0 1px 0
                rgba(255,255,255,.2),

                0 15px 45px
                rgba(0,0,0,.2);

            font-family: inherit;

            font-size: .9rem;

            transition:
                border-color .25s ease,
                box-shadow .25s ease;
        }

        #search::placeholder {
            color:
                rgba(255,255,255,.38);
        }

        #search:focus {
            border-color:
                rgba(156,124,255,.55);

            box-shadow:
                0 0 0 4px
                rgba(156,124,255,.08),

                0 20px 60px
                rgba(0,0,0,.25);
        }

        .search-icon {
            position: absolute;

            top: 50%;
            left: 16px;

            width: 18px;
            height: 18px;

            transform:
                translateY(-50%);

            color:
                rgba(255,255,255,.43);

            pointer-events: none;
        }

        .search-key {
            position: absolute;

            top: 50%;
            right: 12px;

            transform:
                translateY(-50%);

            padding:
                4px 7px;

            border:
                1px solid
                rgba(255,255,255,.11);

            border-radius: 7px;

            color:
                rgba(255,255,255,.3);

            background:
                rgba(255,255,255,.04);

            font-size: .65rem;
        }

        /* =====================================================
           LOCATION LIST
        ===================================================== */

        #locations {
            flex: 1 1 auto;

            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            display: flex;

            flex-direction: column;

            gap: 10px;

            padding:
                2px
                4px
                20px
                2px;

            scrollbar-width: thin;

            scrollbar-color:
                rgba(255,255,255,.15)
                transparent;
        }

        #locations::-webkit-scrollbar {
            width: 5px;
        }

        #locations::-webkit-scrollbar-track {
            background: transparent;
        }

        #locations::-webkit-scrollbar-thumb {
            border-radius: 999px;

            background:
                rgba(255,255,255,.15);
        }

        /* =====================================================
           CARDS
        ===================================================== */

        .location {
            position: relative;

            flex: 0 0 var(--card-height);

            min-width: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            padding:
                12px 13px;

            overflow: hidden;

            isolation: isolate;

            text-decoration: none;

            color: white;

            border:
                1px solid
                var(--border);

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.105),
                    rgba(255,255,255,.032)
                );

            backdrop-filter:
                blur(27px)
                saturate(155%);

            -webkit-backdrop-filter:
                blur(27px)
                saturate(155%);

            box-shadow:
                inset
                0 1px 0
                rgba(255,255,255,.22),

                inset
                0 -1px 0
                rgba(0,0,0,.2),

                0 14px 40px
                rgba(0,0,0,.18);

            opacity: 0;

            transform:
                translateY(12px);

            animation:
                cardIn
                .45s
                cubic-bezier(.2,.8,.2,1)
                forwards;

            transition:
                transform .3s ease,
                border-color .3s ease,
                background .3s ease,
                box-shadow .3s ease;
        }

        .location::before {
            content: "";

            position: absolute;

            inset: -50%;

            z-index: -2;

            background:
                radial-gradient(
                    circle at 0% 50%,
                    rgba(156,124,255,.18),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 100% 100%,
                    rgba(108,221,255,.12),
                    transparent 36%
                );

            filter: blur(25px);

            opacity: .5;
        }

        .location:hover {
            transform:
                translateY(-3px);

            border-color:
                var(--border-hover);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.14),
                    rgba(255,255,255,.045)
                );

            box-shadow:
                inset
                0 1px 0
                rgba(255,255,255,.3),

                0 22px 60px
                rgba(0,0,0,.28),

                0 0 40px
                rgba(156,124,255,.07);
        }

        .location:active {
            transform:
                scale(.98);
        }

        .location-left {
            min-width: 0;

            display: flex;

            align-items: center;

            gap: 13px;
        }

        .number {
            width: 44px;
            height: 44px;

            flex: 0 0 44px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(255,255,255,.13);

            border-radius: 13px;

            color:
                rgba(255,255,255,.7);

            background:
                linear-gradient(
                    135deg,
                    rgba(156,124,255,.2),
                    rgba(108,221,255,.1)
                );

            font-size: .7rem;

            font-weight: 700;
        }

        .text {
            min-width: 0;
        }

        .title {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: .95rem;

            font-weight: 650;

            text-transform: capitalize;
        }

        .small {
            margin-top: 5px;

            color:
                var(--text-faint);

            font-size: .68rem;
        }

        .arrow {
            width: 44px;
            height: 44px;

            flex: 0 0 44px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(255,255,255,.13);

            border-radius: 14px;

            color:
                rgba(255,255,255,.5);

            background:
                rgba(255,255,255,.04);

            transition:
                .3s ease;
        }

        .arrow svg {
            width: 17px;
            height: 17px;
        }

        .location:hover .arrow {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(156,124,255,.55),
                    rgba(108,221,255,.4)
                );

            transform:
                translateX(3px);
        }

        /* =====================================================
           STATES
        ===================================================== */

        .state {
            padding:
                50px 20px;

            text-align: center;

            color:
                var(--text-soft);
        }

        .state-icon {
            width: 48px;
            height: 48px;

            margin:
                0 auto 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(255,255,255,.13);

            border-radius: 16px;

            background:
                rgba(255,255,255,.05);
        }

        .state p {
            font-size: .84rem;
        }

        .state small {
            display: block;

            margin-top: 8px;

            color:
                var(--text-faint);

            font-size: .68rem;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            position: fixed;

            z-index: 20;

            left: 50%;

            bottom:
                calc(
                    max(
                        14px,
                        env(safe-area-inset-bottom)
                    ) + 10px
                );

            transform:
                translateX(-50%);

            max-width:
                calc(100% - 28px);

            padding:
                11px 20px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            border:
                1px solid
                rgba(255,255,255,.16);

            border-radius: 999px;

            color:
                rgba(255,255,255,.48);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.10),
                    rgba(255,255,255,.035)
                );

            backdrop-filter:
                blur(22px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(22px)
                saturate(150%);

            box-shadow:
                inset
                0 1px 0
                rgba(255,255,255,.20),

                0 12px 40px
                rgba(0,0,0,.28);

            font-size: .76rem;
        }

        footer span {
            color:
                #9cecff;

            text-shadow:
                0 0 15px
                rgba(108,221,255,.7);
        }

        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes cardIn {

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width:600px) {

            :root {
                --page-padding-x: 14px;

                --page-padding-top: 20px;

                --page-padding-bottom: 110px;

                --card-height: 70px;
            }

            h1 {
                font-size:
                    clamp(
                        2.8rem,
                        16vw,
                        4rem
                    );
            }

            .description {
                font-size: .78rem;
            }

            #search {
                height: 50px;
            }

            .number,
            .arrow {
                width: 40px;
                height: 40px;

                flex-basis: 40px;
            }

            .location {
                padding:
                    10px 11px;

                border-radius: 21px;
            }

            .title {
                font-size: .86rem;
            }

            .small {
                display: none;
            }

            footer {
                bottom:
                    calc(
                        max(
                            14px,
                            env(safe-area-inset-bottom)
                        ) + 10px
                    );

                font-size: .72rem;

                padding:
                    10px 17px;
            }
        }

        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width:380px) {

            :root {
                --page-padding-x: 11px;

                --page-padding-top: 15px;

                --card-height: 64px;
            }

            .description {
                display: none;
            }

            .number,
            .arrow {
                width: 36px;
                height: 36px;

                flex-basis: 36px;
            }

            .title {
                font-size: .8rem;
            }
        }

        /* =====================================================
           SHORT SCREENS
        ===================================================== */

        @media (max-height:650px) {

            :root {
                --page-padding-top: 14px;

                --page-padding-bottom: 104px;

                --card-height: 62px;
            }

            .description {
                display: none;
            }

            #search {
                height: 46px;
            }

            #locations {
                gap: 7px;
            }

            .number,
            .arrow {
                width: 38px;
                height: 38px;

                flex-basis: 38px;
            }

            footer {
                padding:
                    8px 15px;
            }
        }

        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {
                animation: none !important;

                transition: none !important;
            }
        }

    </style>
</head>


<body>

    <!-- BACKGROUND -->

    <div class="background">

        <div class="blob blob-purple"></div>

        <div class="blob blob-blue"></div>

        <div class="blob blob-pink"></div>

    </div>


    <div class="vignette"></div>


    <!-- PAGE -->

    <main class="page">

        <header class="header">

            <div class="brand">

                <span class="brand-dot"></span>

                KYRADAI

            </div>


            <h1>
                Tour
            </h1>


            <p class="description">
                Explore the places, memories and
                moments from the journey.
            </p>


            <div class="search">

                <input
                    id="search"
                    type="search"
                    placeholder="Search locations..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search locations"
                >


                <svg
                    class="search-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    />

                    <path
                        d="m20 20-3.5-3.5"
                    />

                </svg>


                <span class="search-key">
                    /
                </span>

            </div>

        </header>


        <section
            id="locations"
            aria-live="polite"
        ></section>

    </main>


    <!-- FOOTER -->

    <footer>

        Made with
        <span>💙</span>
        for the people I love.

    </footer>


    <script>

        /* =====================================================
           GITHUB CONFIGURATION
        ===================================================== */

        const GITHUB_OWNER = "kyradai";

        const GITHUB_REPO = "tour";

        const GITHUB_BRANCH = "main";


        /* =====================================================
           STATE
        ===================================================== */

        let locations = [];

        let filteredLocations = [];


        const locationContainer =
            document.getElementById(
                "locations"
            );


        const searchInput =
            document.getElementById(
                "search"
            );


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =====================================================
           LOADING
        ===================================================== */

        function showLoading() {

            locationContainer.innerHTML = `

                <div class="state">

                    <div class="state-icon">

                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                        >

                            <circle
                                cx="12"
                                cy="12"
                                r="8"
                            />

                            <path
                                d="M12 8v4l2.5 2"
                            />

                        </svg>

                    </div>

                    <p>
                        Loading locations...
                    </p>

                </div>

            `;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        function showError(message) {

            locationContainer.innerHTML = `

                <div class="state">

                    <div
                        class="state-icon"
                        style="
                            color:#ff8fa3;
                            font-weight:700;
                        "
                    >
                        !
                    </div>

                    <p>
                        Could not load locations.
                    </p>

                    <small>
                        ${escapeHTML(message)}
                    </small>

                </div>

            `;
        }


        /* =====================================================
           LOAD FOLDERS FROM GITHUB
        ===================================================== */

        async function loadLocations() {

            showLoading();


            try {

                /*
                 * GitHub API endpoint:
                 *
                 * /repos/kyradai/tour/contents/
                 *
                 * This reads the ROOT of the repository.
                 */

                const apiURL =
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;


                const response =
                    await fetch(
                        apiURL,
                        {
                            cache:
                                "no-store",

                            headers: {
                                Accept:
                                    "application/vnd.github+json"
                            }
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        `GitHub API error: HTTP ${response.status}`
                    );
                }


                const files =
                    await response.json();


                if (
                    !Array.isArray(files)
                ) {

                    throw new Error(
                        "GitHub returned an invalid response."
                    );
                }


                /*
                 * Only directories count as locations.
                 *
                 * index.html
                 * README.md
                 * etc.
                 *
                 * are ignored.
                 */

                const folders =
                    files.filter(
                        item =>
                            item.type === "dir"
                    );


                /*
                 * Convert folders into locations.
                 */

                locations =
                    folders.map(
                        folder => ({

                            name:
                                folder.name
                                    .replace(
                                        /-/g,
                                        " "
                                    ),

                            slug:
                                folder.name,

                            url:
                                `/${encodeURIComponent(
                                    folder.name
                                )}/`

                        })
                    );


                /*
                 * Alphabetical order.
                 */

                locations.sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name,
                            undefined,
                            {
                                sensitivity:
                                    "base"
                            }
                        )
                );


                /*
                 * Add numbers after sorting.
                 */

                locations.forEach(
                    (location, index) => {

                        location.number =
                            String(
                                index + 1
                            ).padStart(
                                2,
                                "0"
                            );
                    }
                );


                filterLocations();

            }
            catch (error) {

                console.error(
                    "Could not load locations:",
                    error
                );

                showError(
                    error.message
                );
            }
        }


        /* =====================================================
           RENDER LOCATIONS
        ===================================================== */

        function renderLocations(
            items
        ) {

            locationContainer.innerHTML =
                "";


            if (
                items.length === 0
            ) {

                locationContainer.innerHTML = `

                    <div class="state">

                        <div class="state-icon">

                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <circle
                                    cx="11"
                                    cy="11"
                                    r="7"
                                />

                                <path
                                    d="m20 20-3.5-3.5"
                                />

                            </svg>

                        </div>

                        <p>
                            No matching locations found.
                        </p>

                    </div>

                `;

                return;
            }


            items.forEach(
                (location, index) => {

                    const card =
                        document.createElement(
                            "a"
                        );


                    card.className =
                        "location";


                    card.href =
                        location.url;


                    card.style.animationDelay =
                        `${index * 45}ms`;


                    card.innerHTML = `

                        <div class="location-left">

                            <div class="number">

                                ${escapeHTML(
                                    location.number
                                )}

                            </div>


                            <div class="text">

                                <div class="title">

                                    ${escapeHTML(
                                        location.name
                                    )}

                                </div>


                                <div class="small">
                                    Explore location
                                </div>

                            </div>

                        </div>


                        <div class="arrow">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M5 12h14"
                                />

                                <path
                                    d="m13 6 6 6-6 6"
                                />

                            </svg>

                        </div>

                    `;


                    locationContainer.appendChild(
                        card
                    );

                }
            );
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        function filterLocations() {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();


            filteredLocations =
                locations.filter(
                    location =>
                        location.name
                            .toLowerCase()
                            .includes(
                                query
                            )
                );


            renderLocations(
                filteredLocations
            );
        }


        searchInput.addEventListener(
            "input",
            filterLocations
        );


        /* =====================================================
           KEYBOARD SHORTCUT
        ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "/" &&
                    document.activeElement !==
                        searchInput
                ) {

                    event.preventDefault();

                    searchInput.focus();
                }


                if (
                    event.key === "Escape"
                ) {

                    searchInput.value =
                        "";

                    filterLocations();

                    searchInput.blur();
                }
            }
        );


        /* =====================================================
           REFRESH EVERY 5 MINUTES
        ===================================================== */

        setInterval(
            () => {

                loadLocations();

            },
            5 * 60 * 1000
        );


        /* =====================================================
           INITIAL LOAD
        ===================================================== */

        loadLocations();

    </script>

</body>
</html>
