name: Generate Locations & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate locations.json
        run: node generate-locations.js

      - name: Commit and Push locations.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add locations.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate locations.json" && git push)
